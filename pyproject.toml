[build-system]
requires = ["setuptools>=77", "wheel", "Cython>=3.0,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "dagger"
version = "0.1.0"
description = "An independent Cython implementation of Jagger-style Japanese morphological analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "dagger contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Cython",
  "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
dagger = "dagger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

